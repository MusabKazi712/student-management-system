{% extends "base.html" %}

{% block title %}Update Record | EduManage{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container glass-panel">
        <div class="form-header">
            <h2>Update Student Profile</h2>
            <p>Modify official records for <strong>{{ student['name'] }}</strong></p>
        </div>
        
        <form method="POST">
            <div class="form-grid">
                
                <div class="form-group">
                    <label>Roll Number (Unique)</label>
                    <input type="text" name="roll_no" class="form-control" value="{{ student['roll_no'] }}" required>
                </div>
                
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ student['name'] }}" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" class="form-control" value="{{ student['dob'] }}" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" class="form-control" required>
                        <option value="Male" {% if student['gender'] == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student['gender'] == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if student['gender'] == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status" class="form-control" required>
                        <option value="Active" {% if student['status'] == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Inactive" {% if student['status'] == 'Inactive' %}selected{% endif %}>Inactive</option>
                        <option value="Graduated" {% if student['status'] == 'Graduated' %}selected{% endif %}>Graduated</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" value="{{ student['email'] }}" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" value="{{ student['phone'] }}" pattern="\d{10}" title="Phone number must be exactly 10 digits" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label>Program / Course</label>
                    <select name="course" class="form-control" required>
                        <option value="">Select Course</option>
                        {% for c in courses %}
                        <option value="{{ c.name }}" {% if student['course'] == c.name %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Current Semester (1-12)</label>
                    <input type="number" name="semester" class="form-control" min="1" max="12" value="{{ student['semester'] }}" required>
                </div>

                <div class="form-group">
                    <label>Academic Marks (%)</label>
                    <input type="number" step="0.01" name="marks" class="form-control" min="0" max="100" value="{{ student['marks'] }}" required>
                </div>

                <div class="form-group full-width">
                    <label>Permanent Address</label>
                    <textarea name="address" class="form-control" required>{{ student['address'] }}</textarea>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('home') }}" class="btn btn-secondary"><i class='bx bx-arrow-back'></i> Cancel Update</a>
                    <button type="submit" class="btn"><i class='bx bx-check-circle'></i> Save Changes Securely</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
